name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_DIR: ~/community-project

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PUBLIC_EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H ${{ secrets.PRIVATE_EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build Docker Image
        run: |
          # Build explicitly for amd64 (EC2 architecture)
          docker build --platform linux/amd64 -t community-backend:latest .
          docker save -o backend-image.tar community-backend:latest
      
      - name: Transfer Image to Public EC2
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no backend-image.tar ubuntu@${{ secrets.PUBLIC_EC2_IP }}:~/
      
      - name: Deploy to Private EC2
        run: |
          # SSH Jump Host Command
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.PUBLIC_EC2_IP }} << 'EOF'
            set -e
            
            # Step 1: Ensure directory exists on Private EC2
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.PRIVATE_EC2_IP }} \
              "mkdir -p ${{ env.PROJECT_DIR }}/3-caleb-son-community-BE"
            
            # Step 2: Transfer Image to Private EC2
            echo "Transerring image to Private EC2..."
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ~/backend-image.tar \
              ubuntu@${{ secrets.PRIVATE_EC2_IP }}:${{ env.PROJECT_DIR }}/3-caleb-son-community-BE/
            
            # Step 3: Deploy on Private EC2
            echo "Deploying on Private EC2..."
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.PRIVATE_EC2_IP }} << 'INNER_EOF'
              set -e
              cd ${{ env.PROJECT_DIR }}/3-caleb-son-community-BE
              
              # Load & Tag Image
              docker load -i backend-image.tar
              # IMPORTANT: Tag the image to match docker-compose.yml expectation
              docker tag community-backend:latest community-project-backend:latest
              rm backend-image.tar
              
              # Restart Service
              cd ${{ env.PROJECT_DIR }}
              docker-compose stop backend || true
              docker-compose rm -f backend || true
              docker-compose up -d backend
            INNER_EOF
            
            # Cleanup on Public EC2
            rm ~/backend-image.tar
            echo "Deployment Complete!"
          EOF
